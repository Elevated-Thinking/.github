name: Bug Report
description: Report something that isn't working as expected.
type: Bug
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Tell us what went wrong. Please remove passwords, tokens and personal information from any examples or screenshots.
        For a security vulnerability, use GitHub's private security reporting option instead of a public issue.
  - type: textarea
    id: actual
    attributes:
      label: What happened?
      description: Describe the problem and any error message you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we reproduce it?
      description: List the steps that led to the problem. If you cannot reproduce it, tell us what you were doing when it happened.
      placeholder: |
        1. Open ...
        2. Select ...
        3. See ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: App version, device or browser
      description: Share what you know; it is fine to leave this blank.
      placeholder: e.g. version 1.2, iPhone with iOS 26, or Safari on a Mac
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or other details
      description: Optional. You can drag screenshots here. Remove sensitive information first.
